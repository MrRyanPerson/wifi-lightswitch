[project]
name = "reciever"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mpremote>=1.29.0",
]

[tool.mypy]
# places to check
files = "./*.py"
mypy_path = "./lib,typings"

platform = "linux"
custom_typeshed_dir = "typings" # allow mypy to use micropython-stdlib
exclude = [
    "typings[\\/].*",  # TOML basic string
    ".*",
    "__*",
    "**/node_modules", 
    "**/__pycache__", 
    ".venv",
]

follow_imports = "silent"
follow_imports_for_stubs = true
no_site_packages = true
check_untyped_defs = true
disable_error_code = ["no-redef","assignment"]

[project.optional-dependencies]
# install to folder typings
# uv pip install -r pyproject.toml --extra stubs --target typings
stubs = [
  "micropython-rp2-rpi_pico2_w-stubs==1.28.0.*"
]
